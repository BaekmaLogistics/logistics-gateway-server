spring:
  application:
    name: gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
                - Path=/api/v1/delivery-managers/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/slack-messages/**
              filters:
                - JwtAuthenticationFilter

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - JwtAuthenticationFilter

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/deliveries/**
              filters:
                - JwtAuthenticationFilter

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/v1/companies/**
                - Path=/api/v1/products/**
              filters:
                - JwtAuthenticationFilter

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - JwtAuthenticationFilter

            - id: hubs-service
              uri: lb://hubs-service
              predicates:
                - Path=/api/v1/hubs/**
                - Path=/api/v1/hub-routes/**
                - Path=/api/v1/hub-inventories/**
              filters:
                - JwtAuthenticationFilter

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_SERVER:http://localhost:9411/api/v2/spans}

server:
  port: 18080

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}